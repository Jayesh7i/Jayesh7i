[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jayesh7i"
version = "0.1.0"
description = "Starter Python project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jayesh" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
jayesh7i = "jayesh7i.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
